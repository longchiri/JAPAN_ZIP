# 전국 음식점 DB 자동 갱신 (무료: GitHub Actions, API 키 없음)
# - 매월 2일 새벽(한국시간 03:17) 자동 실행, Actions 탭에서 "Run workflow"로 수동 실행 가능
# - Geofabrik 일본 OSM 추출본(약 2GB)을 받아 data/osm/*.json 을 다시 만들고 커밋합니다.
name: Build OSM restaurant DB

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 1 * *'

permissions:
  contents: write

concurrency:
  group: build-osm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Check files
        run: |
          if [ ! -f scripts/build_osm.py ]; then
            echo "::error::scripts/build_osm.py 파일이 저장소에 없습니다. scripts 폴더를 업로드하세요."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y osmium-tool
          osmium --version
          python -m pip install "shapely>=2.0" numpy sudachipy sudachidict_core

      - name: Download Japan extract (Geofabrik)
        run: |
          mkdir -p /tmp/osm
          curl -fL --retry 3 -o /tmp/osm/japan.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf
          ls -lh /tmp/osm

      - name: Filter food / spots and boundaries
        working-directory: /tmp/osm
        run: |
          osmium tags-filter japan.osm.pbf \
            nwr/amenity=restaurant,cafe,fast_food,bar,pub,izakaya,food_court,ice_cream,biergarten,public_bath \
            nwr/shop=bakery,confectionery,pastry,supermarket,deli,seafood,convenience \
            nwr/tourism=attraction,museum,viewpoint,theme_park,zoo,aquarium,gallery,hotel,hostel,guest_house,motel,apartment \
            nwr/natural=hot_spring nwr/historic=castle \
            -o food.osm.pbf --overwrite
          osmium export food.osm.pbf -f geojsonseq -a type,id \
            --geometry-types=point,polygon -o food.geojsonseq --overwrite
          osmium tags-filter japan.osm.pbf r/boundary=administrative -o boundary.osm.pbf --overwrite
          osmium tags-filter boundary.osm.pbf r/admin_level=4,7,8 -o admin.osm.pbf --overwrite
          osmium export admin.osm.pbf -f geojsonseq --geometry-types=polygon -o admin.geojsonseq --overwrite
          rm -f japan.osm.pbf boundary.osm.pbf
          ls -lh

      - name: Build per-prefecture JSON
        run: |
          python scripts/build_osm.py --food /tmp/osm/food.geojsonseq --admin /tmp/osm/admin.geojsonseq --out data/osm
          du -sh data/osm

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(data): OSM 전국 음식점 DB 갱신 $(date -u +%Y-%m-%d)"
          git push
